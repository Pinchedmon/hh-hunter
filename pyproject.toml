[project]
name = "hh-hunter"
version = "0.1.0"
description = "Local job-hunting cockpit for hh.ru: search, Claude-written letters, human approve, auto-apply"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "playwright>=1.48", "anthropic>=0.80"]

[project.scripts]
hunter = "hunter.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["hunter"]
